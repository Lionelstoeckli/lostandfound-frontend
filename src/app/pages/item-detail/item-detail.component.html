<div>
  <div>
    <mat-toolbar color="primary">
      <mat-toolbar-row>
        <span class="toolbar-spacer"></span>
        <button (click)="back()" color="primary" mat-button style="color: white">
          <mat-icon>arrow_back_ios</mat-icon>
          {{ 'main.button_back' | translate }}
        </button>
      </mat-toolbar-row>
    </mat-toolbar>
  </div>
  <div class="app-form">
    <form (ngSubmit)="save(objForm.value)" [formGroup]="objForm!">
      <mat-form-field>
        <mat-label>{{ 'item.name' | translate }}</mat-label>
        <input #inputName appAutofocus formControlName="name" matInput maxlength="255" required>
        <mat-hint align="end">{{inputName.value.length || 0}}/255</mat-hint>
      </mat-form-field>
      <mat-form-field>
        <mat-label>{{ 'item.color' | translate }}</mat-label>
        <input #inputColor formControlName="color" matInput maxlength="50">
        <mat-hint align="end">{{inputColor.value.length || 0}}/50</mat-hint>
      </mat-form-field>
      <mat-form-field>
        <mat-label>{{ 'item.description' | translate }}</mat-label>
        <textarea #inputDescription cdkAutosizeMaxRows="10"
          cdkAutosizeMinRows="4"
        cdkTextareaAutosize formControlName="description" matInput maxlength="1000"></textarea>
        <mat-hint align="end">{{inputDescription.value.length || 0}}/1000</mat-hint>
      </mat-form-field>
      <button [disabled]="!objForm.valid" color="primary" mat-raised-button style="width: 200px">
        {{ 'main.button_save' | translate }}
      </button>
    </form>
  </div>
</div>
